:root{--teal:#0b7a75;--ink:#14213d;--mute:#5b6775;--line:#d6dce3}

body{margin:0;min-height:100vh;min-height:100dvh;font:15px/1.5 "IBM Plex Sans",Arial,sans-serif;color:var(--ink);background:radial-gradient(900px 600px at 12% 8%,rgba(79,209,197,.30),transparent 60%),radial-gradient(900px 600px at 92% 92%,rgba(11,122,117,.50),transparent 60%),linear-gradient(145deg,#071a2e,#0a2540 55%,#0b4a52);display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:60px 0 16px}
.card{position:relative;width:100%;max-width:410px;background:#fff;border-radius:20px;padding:58px 30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45);text-align:center}
.badge{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#0b7a75,#4fd1c5);display:flex;align-items:center;justify-content:center;border:5px solid #fff;box-shadow:0 8px 20px rgba(11,122,117,.45)}
.badge svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:6px 14px;margin-bottom:12px;background:#fff}.logo img{height:44px;display:block}
h1{font:600 30px/1.15 "IBM Plex Serif",Georgia,serif;letter-spacing:1.5px;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
.info{display:none;margin:0 0 14px;padding:9px 12px;border-radius:8px;background:#fff6e5;color:#8a5a00;font-size:13px;font-weight:600}
.f{position:relative;text-align:left;margin-bottom:14px}.f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.w{position:relative}.w svg.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:11px 42px 11px 40px}
input:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;display:flex}
.eye svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 0 4px;text-align:left;cursor:pointer}.rm input{width:16px;height:16px;margin:0}
.go{width:100%;margin-top:6px;font:inherit;font-weight:600;color:#fff;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:linear-gradient(135deg,#0b7a75,#0e9f98);display:flex;gap:10px;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(11,122,117,.35)}
.go svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.go:disabled{opacity:.65;cursor:default}
.err{min-height:22px;margin:8px 0 0;color:#b3261e;font-size:14px;font-weight:600}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
footer{text-align:center;color:rgba(255,255,255,.85);font-size:13px;padding:12px 0 20px;line-height:1.6}footer b{color:#fff;font-weight:600}
